# A generic, single database configuration for IRYX (project root).

[alembic]
# path to migration scripts
script_location = %(here)s/backend/migrations

# sys.path path
prepend_sys_path = %(here)s/backend/src

# version location specification
version_locations = %(here)s/backend/migrations/versions

# separator for multi-directory paths
path_separator = os

# timezone to use when rendering the date within the migration file
timezone = UTC

# the output encoding used when revisions are generated
output_encoding = utf-8

# default database URL (overridden dynamically by env.py from application settings)
sqlalchemy.url = postgresql+psycopg://iryx:iryx_password@localhost:5432/iryx_db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
