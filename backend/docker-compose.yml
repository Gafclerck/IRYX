services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER est requis dans backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis dans backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB est requis dans backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  iryx-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER est requis dans backend/.env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis dans backend/.env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB est requis dans backend/.env}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EVIDENCE_STORAGE_PATH: /data/evidence/
      EVIDENCE_STAGING_PATH: /data/evidence/staging
      VOLATILITY_SYMBOLS_PATH: /opt/volatility3/symbols
    ports:
      - "8000:8000"
    volumes:
      - evidence_data:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  iryx-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER est requis dans backend/.env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis dans backend/.env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB est requis dans backend/.env}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EVIDENCE_STORAGE_PATH: /data/evidence/
      EVIDENCE_STAGING_PATH: /data/evidence/staging
      VOLATILITY_SYMBOLS_PATH: /opt/volatility3/symbols
    volumes:
      - evidence_data:/data/evidence
      - symbols_data:/opt/volatility3/symbols:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      iryx-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import glob, sys; ok=any((parts := open(p, encoding='utf-8', errors='ignore').read().split(chr(0))) and any(part.endswith('celery') for part in parts) and 'worker' in parts for p in glob.glob('/proc/[0-9]*/cmdline')); sys.exit(0 if ok else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  evidence_data:
  symbols_data:
