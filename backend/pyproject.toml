[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iryx"
version = "0.1.0"
description = "Plateforme d'investigation numérique (DFIR) supervisée par IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pwdlib[argon2]>=0.2.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.9.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "filetype>=1.2.0",
    "python-evtx>=0.7.4",
    "regipy>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iryx"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "backend", "backend/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
