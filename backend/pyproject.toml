[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iryx"
version = "0.1.0"
description = "Plateforme d'investigation numérique (DFIR) supervisée par IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pwdlib[argon2]>=0.2.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.9.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "filetype>=1.2.0",
    "python-evtx>=0.7.4",
    "regipy>=5.1.0",
    "dissect>=3.13.0",
    "volatility3==2.7.0",
    "pefile>=2023.2.7",
    "openai>=1.50.0",
    "tenacity>=9.0.0",
    "langgraph>=0.2.20",
    "langgraph-checkpoint-postgres>=3.2.1",
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iryx"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
    "ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning",
]
addopts = "-ra"
